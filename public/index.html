<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CooperAbaeté — GAPS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#18342e;font:15px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:clamp(16px,4vw,54px)}header{background:#133d33;color:white;padding:28px;border-radius:16px}header small{color:#b5e9d5;letter-spacing:.12em;text-transform:uppercase}h1{margin:.35em 0;font-size:clamp(28px,5vw,42px)}header p{margin:0;color:#e1f1ea}section{margin-top:22px;background:white;border:1px solid #d2dfd9;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1080px;table-layout:fixed}th,td{padding:10px;text-align:left;border-bottom:1px solid #dce6e1;vertical-align:top}th{background:#e1efe9}th:first-child{width:25%}th:nth-child(2){width:9%}th:nth-child(3){width:18%}th:nth-child(4){width:14%}th:nth-child(5){width:25%}tbody tr:nth-child(even){background:#f6f9f7}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #a9c0b6;border-radius:6px;padding:8px;background:white;color:inherit}textarea{resize:vertical;min-height:58px}button{background:#14654e;color:white;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.55;cursor:default}:focus-visible{outline:3px solid #168664;outline-offset:2px}td small{display:block;margin-top:5px}#notice{min-height:1.5em}
#filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:16px 0}tr.concluida td{background:#176047;color:white}.concluida :is(input,textarea,select,button):disabled{background:#124b38;color:white;opacity:1;-webkit-text-fill-color:white}</style>
<main>
<header><small>Acompanhamento do projeto</small><h1>CooperAbaeté — GAPS</h1><p>Atualize os campos e clique em Salvar na linha correspondente.</p></header>
<p><a href="https://script.google.com/macros/s/AKfycbyMmo-_Jhgz8G6hcHB3kgLf6-WWOhuTtk7HIILCfCjAv20rvMiPodUlmsb_lPgxBbiJ/exec">Abrir a base compartilhada da CooperAbaeté</a></p>
<p id="notice" role="status">Carregando atividades…</p>
<div id="filters"><label>Responsável pela validação<select id="filter-owner"></select></label><label>Impeditivo de go-live<select id="filter-blocker"><option value="all">Todos</option><option>Sim</option><option>Não</option><option value="">Sem definição</option></select></label><button id="clear-filters">Limpar filtros</button><span id="filter-count" role="status"></span></div>
<section aria-label="Grade de atividades" tabindex="0"><table><thead><tr><th>Atividade</th><th>Conclusão (%)</th><th>Responsável pela validação</th><th>Impeditivo p/ GO LIVE</th><th>Status</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></section>
<noscript>Ative o JavaScript para carregar e salvar as atividades.</noscript>
</main>
<script>
const notice = document.querySelector('#notice');
const body = document.querySelector('#rows');
const columns = [
 ['activity','Atividade',1000], ['completion','Conclusão (%)',4],
 ['owner','Responsável pela validação',300],
 ['blocker','Impeditivo p/ GO LIVE',3], ['status','Status',2000]
];

const ownerFilter = document.querySelector('#filter-owner');
const blockerFilter = document.querySelector('#filter-blocker');
const filterCount = document.querySelector('#filter-count');
const renderedRows = [];
const ownerKey = value => 'owner:' + (value || '').trim().toLocaleLowerCase('pt-BR');

function applyFilters() {
 let visible = 0;
 for (const {row, tr} of renderedRows) {
  const matchesOwner = ownerFilter.value === 'all' || ownerFilter.value === ownerKey(row.owner);
  const matchesBlocker = blockerFilter.value === 'all' || blockerFilter.value === (row.blocker || '');
  tr.hidden = !(matchesOwner && matchesBlocker);
  if (!tr.hidden) visible++;
 }
 filterCount.textContent = visible + ' de ' + renderedRows.length + ' atividades';
}

function refreshOwners() {
 const selected = ownerFilter.value;
 const owners = new Map();
 for (const {row} of renderedRows) {
  if (row.owner?.trim()) owners.set(ownerKey(row.owner), row.owner.trim());
 }
 ownerFilter.replaceChildren(new Option('Todos', 'all'), new Option('Sem responsável', 'owner:'));
 for (const [key, name] of [...owners].sort((a,b) => a[1].localeCompare(b[1], 'pt-BR'))) {
  ownerFilter.add(new Option(name, key));
 }
 ownerFilter.value = [...ownerFilter.options].some(option => option.value === selected) ? selected : 'all';
 applyFilters();
}
ownerFilter.addEventListener('change', applyFilters);
blockerFilter.addEventListener('change', applyFilters);
document.querySelector('#clear-filters').addEventListener('click', () => {
 ownerFilter.value = blockerFilter.value = 'all';
 applyFilters();
});

function render(row) {
 const tr = body.insertRow();
 renderedRows.push({row, tr});
 const controls = columns.map(([key, label, max]) => {
  const cell = tr.insertCell();
  let field;
  if (key === 'blocker') {
   field = document.createElement('select');
   for (const [value, name] of [['','—'],['Sim','Sim'],['Não','Não']]) field.add(new Option(name, value));
  } else {
   field = document.createElement(key === 'status' || key === 'activity' ? 'textarea' : 'input');
   field.maxLength = max;
   if (key === 'completion') field.placeholder = '0–100';
  }
  field.setAttribute('aria-label', label + ' · atividade ' + row.id);
  field.value = row[key];
  cell.append(field);
  return field;
 });
 const action = tr.insertCell();
 const button = document.createElement('button');
 button.textContent = 'Salvar';
 button.setAttribute('aria-label', 'Salvar atividade ' + row.id);
 button.disabled = true;
 const message = document.createElement('small');
 message.setAttribute('role', 'status');
 action.append(button, message);
 function lockIfComplete() {
  const complete = String(row.completion).trim().replace(/%$/, '').trim() === '100';
  controls.forEach(field => field.disabled = complete);
  if (!complete) return;
  tr.classList.add('concluida');
  button.disabled = true;
  button.textContent = 'Concluído';
  button.setAttribute('aria-label', 'Atividade ' + row.id + ' concluída e bloqueada');
 }
 lockIfComplete();
 controls.forEach(field => field.addEventListener('input', () => { button.disabled = false; message.textContent = ''; }));
 button.addEventListener('click', async () => {
  button.disabled = true;
  controls.forEach(field => field.disabled = true);
  message.textContent = 'Salvando…';
  try {
   const values = Object.fromEntries(columns.map(([key], index) => [key, controls[index].value]));
   const result = await call('saveRow', row.id, {...values, revision:row.revision});
   if (result.error) throw new Error(result.error);
   Object.assign(row, result);
   refreshOwners();
   controls.forEach((field, i) => field.value = result[columns[i][0]]);
   message.textContent = 'Salvo.';
  } catch (error) {
   message.textContent = error.message === 'Failed to fetch' ? 'Falha de conexão. Tente novamente.' : error.message;
   button.disabled = false;
  } finally {
   lockIfComplete();
  }
 });
}
const seed = [["Configuração do servidor, SQL e REST","100","Pronto","Formiga","Sim"],["Integração InfoPrice","50","Negociação feita. Aprovada a base de teste em 12/11/2026.","Formiga","Sim"],["Integração Kikker","75","Aguardando finalização de integração e posterior validação […]","Formiga","Sim"],["Integração Zoetis","75","Aguardando validação Zoetis. Cobrar da empresa urgente. […]","Formiga","Não"],["BCM Fábrica","75","aguardando validação BCM. Cobrar da empresa urgente […]","Formiga","Não"],["RD Brasil Fábrica","25","Aguardando Formiga dar continuidade.","Formiga","Não"],["Sigeve — pedidos e cálculo comercial local","50","Validando pedidos. Ponto de alerta.","Formiga","Sim"],["Integração Sigeve","50","Validando pedidos. Ponto de alerta.","Formiga","Sim"],["Limite — Cálculo","90","Faltando validação dos usuários e uso intenso.","Amanda","Sim"],["Limite — Controle","90","Vendas à prazo iniciadas segunda semana novembro.","Amanda, Elisângela","Sim"],["Senhas de cooperados e dependentes","90","Testes iniciados segunda semana novembro","Amanda","Sim"],["Saldos de dependentes e cooperados","90","Faltando validação dos usuários e uso intenso.","Amanda","Sim"],["Painel de cadastros","100","Painel pronto e já está sendo utilizado.","Formiga","Não"],["Conciliação de convênio","90","O painel foi testado com valores fictícios e, durante a fase de testes, […]","Elisangela","Sim"],["FAT002 – Comissão progressiva","50","Para validar precisamos de dados para validar. Estudar uma forma de […]","Dornelas","Não"],["FAT003 – Tabela de preços personalizada","10","Tratar condição especial do cliente não nas tabelas de preço e sim no […]","Caio","Sim"],["FAT004 – Cálculo automático da precificação","0","Para supermercado está atrelado a infoprice. Na fábrica e postos […]","Formiga","Não"],["Montagem de Carga produto sem estoque","90","Está pronto. Falta capacitação e mais testes.","Formiga","Sim"],["Montagem da Carga solicitação","90","Está pronto. Falta capacitação e mais testes.","Formiga","Sim"],["Restrição de Acesso por Conta Bancária","90","Está pronto. Falta parametrizar usuários (amarração, acessos) e […]","Valentina","Não"],["Juros na Alteração de Vencimento (dispensado)","100","Pronto","Formiga","Não"],["Integração com Plataforma de Crédito","0","Definir qual fonte iremos utilizar, se plataforma de votação ou […]","Caio","Não"],["Estrutura mercadológica","95","Falta método de atualização da EM. Desenhar como será feito.","Formiga","Não"],["COM001 – Bloqueio de produto por filial","25","Primeiro é preciso configurar no Kikker.","Formiga","Não"],["G126 — Monitorar pendências e falhas em painel de integração","50","Falta completar as integrações com os fornecedores da Fábrica (BCM)","Formiga","Não"],["G138 — Completar recibo automático, reimpressão e composição de pagamentos","90","Validar com o financeiro, testes intensos. Neste momento 100% […]","Valentina","Não"],["G139 — Consultar itens da nota fiscal pelo título a receber","100","Não será implantado. Pronto.","Formiga","Não"],["G145 — Lançamento múltiplo de serviços com CR por pessoa e CP por prestador","100","Ok. testado e funcionando","Formiga","Não"],["G146 — Controlar preparação, download e envio de remessas de cobrança e contas a pagar","75","Falta Formiga validar e disponibilizar os testes.","Formiga","Não"],["G150 — Transformação automática de carnes processadas a partir das vendas","25","Pendente de desenvolvimento","Formiga","Não"],["G152 — Consolidar perdas e histórico de movimentação por produto e loja","25"],["G102 — Histórico financeiro/CRM para decisão na loja","0","Verificar com CAIO se será usado o sistema do Diogo.","Caio","Não"],["G104 — Preservar registros de cobrança, negociação e análise extraordinária","0","Será implantado no módulo Callcenter","Formiga","Não"],["G108 — Homologar importador de convênios e serviços por planilha","95","Falta confirmar com os usuários e […]","Elisangela / Braulio","Sim"],["G111 — Identificar Pix de terceiros e recebimentos sem identificação","0","José Marcelo já solicitou habilitação do Formiga no Portal do Sicoob.","Formiga","Não"],["F02 — Calcular frete por região e peso conforme modelo aprovado","90","Será feito no SIGEVE e replicado no Protheus. Está pronto. É preciso […]","Dornelas / Diego","Sim"],["F06 — Pesquisar cliente por matrícula/código, CPF e nome e identificar propriedade","90","Consulta pronta. Falta colocar em todas as consultas do sistema. […]","Usuários Cooperativa","Não"],["F08 — Obter modelo atual de orçamento em PDF","100","Não será implantando. Caso resolvido.","Formiga","Não"],["F10 — Exibir DANFE e boletos após autorização do faturamento","90","Pronto. Falta testes intensos dos usuários.","Usuários Cooperativa","Não"],["F13 — Definir registro automático de boletos","90","Pronto. Falta testes intensos dos usuários.","Amanda","Não"],["F32 — Mensagem fiscal automática dos defensivos por grupo de produto","10","Lista sendo levantada com pessoal da Nectar segunda semana […]","José Marcelo / Gisele","Sim"],["F36 — Exibir crédito disponível antes de concluir o pedido","50","Consultar com os usuários e atualizar este relatório.","Usuários Cooperativa","Não"]];
async function call(method, id, row) {
 const key = 'cooperabaete-render-v1';
 const saved = JSON.parse(localStorage.getItem(key) || '{}');
 if (method === 'listRows') {
  const rows = seed.map(([activity,completion,status='',owner='',blocker=''],index) => {
   const id = index + 1;
   return saved[id] || {id,activity,completion,status,owner,blocker,revision:0};
  });
  return [...rows.slice(0,24), ...rows.slice(31), ...rows.slice(24,31)];
 }
 const previous = saved[id] || {completion:seed[id-1][1],revision:0};
 if (previous.completion === '100') return {error:'Atividade concluída e bloqueada.'};
 if (row.revision !== previous.revision) return {error:'A linha mudou. Recarregue a página.'};
 row.completion = row.completion.trim().replace(/%$/, '').trim();
 if (!row.activity.trim() || !/^(?:100|[1-9]?\d|N\/A|x)$/i.test(row.completion)) {
  return {error:'Informe a atividade e uma conclusão válida.'};
 }
 const result = {...row,id,revision:row.revision+1};
 localStorage.setItem(key,JSON.stringify({...saved,[id]:result}));
 return result;
}
call('listRows').then(rows => {
 rows.forEach(render);
 refreshOwners();
 notice.textContent = rows.length + ' atividades · As alterações desta página ficam neste navegador.';
}).catch(() => { notice.textContent = 'Não foi possível carregar as atividades. Atualize a página para tentar de novo.'; });
</script>
</html>
